<div class="payment-method" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice fz-pmnt-title-apple-pay">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()"/>
        <label data-bind="attr: {'for': getCode()}" class="label">
            <div class="fz-apple-pay-logo-wrapper">
                <img data-bind="attr: { src: require.toUrl('PMNTS_Gateway/images/apple-pay.svg')}" alt="" />
            </div>
            <span class="fz-apple-pay-label" data-bind="text: getTitle()"></span>
        </label>
    </div>

    <div class="payment-method-content fz-pmnt-content-apple-pay">
        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!-- /ko -->

        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!-- /ko -->
        </div>

        <!-- ko if: isApplePayAvailable() -->
        <div class="fz-applepay-button-container">
            <apple-pay-button
                data-bind="attr: getApplePayButtonAttributes(), click: startApplePay, enable: isPlaceOrderActionAllowed"></apple-pay-button>
        </div>
        <!-- /ko -->

        <!-- ko ifnot: isApplePayAvailable() -->
        <div class="message notice">
            <span data-bind="i18n: 'Apple Pay is not available on this device or browser.'"></span>
        </div>
        <!-- /ko -->
    </div>
</div>
